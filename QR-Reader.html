<!DOCTYPE html>
<html lang="de-CH">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sicherheit: Skripte nur von jsDelivr, keine Datenverbindungen nach aussen (connect-src 'none'),
         d.h. selbst eingeschleuster Code könnte empfangene Daten nicht per fetch/XHR wegschicken. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' data:; media-src 'self' blob: mediastream:; connect-src 'none'; form-action 'none'; base-uri 'none'">
    <meta name="referrer" content="no-referrer">
    <title>QR-Code Datenüberträger (ZBar WASM-Edition)</title>

    <!-- Alle Bibliotheken mit fester Version + Integritäts-Hash (SRI): wird eine Datei auf dem CDN
         verändert, verweigert der Browser die Ausführung. Vorher: "@latest" ohne Prüfung. -->
    <!-- ZBar "inlined"-Build: das WASM ist in der JS-Datei enthalten und damit vom SRI-Hash mit abgedeckt -->
    <script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@0.11.0/dist/inlined/index.js" integrity="sha384-EbGJzkj+gTEnDjpWZJGfQ2RXHaIdm5zLuvFqtJI6cdAsjM8VxIIdmx8YG+Qhw1Hn" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js" integrity="sha384-QsSpx6a0USazT7nK7w8qXDgpSAPhFsb2XtpoLFQ5+X2yFN6hvCKnwEzN8M5FWaJb" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js" integrity="sha384-a7SzOxErzJ3ZpQz0zJ32d67dSitNzPcbfybc/ykU9KJhMgZkwqfSxlhhdJRS+XGL" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js" integrity="sha384-0d+Gr7vM4Drod8E3hXKgciWJSWbjD/opKLLygI9ktiWbuvlDwQLzU46wJ9s5gsp7" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" integrity="sha384-GvrOXuhMATgEsSwCs4smul74iXGOixntILdUW9XmUC6+HX0sLNAK3q71HotJqlAn" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" integrity="sha384-cpW21h6RZv/phavutF+AuVYrr+dA8xD9zs6FwLpaCct6O9ctzYFfFr4dgmgccOTx" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>
    <!-- CryptoJS entfernt: Entschlüsselung läuft jetzt über die eingebaute Web Crypto API des Browsers -->

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; color: #1d1d1f; padding: 15px; margin: 0; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        .container { max-width: 500px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; }
        h1 { font-size: 22px; font-weight: 700; margin-top: 10px; margin-bottom: 20px; text-align: center; color: #1d1d1f; }
        
        .scanner-wrapper { position: relative; width: 100%; border-radius: 16px; overflow: hidden; background: #000; box-shadow: 0 8px 24px rgba(0,0,0,0.15); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); aspect-ratio: 4 / 3; }
        .scanner-wrapper.minimized { height: 120px !important; aspect-ratio: auto; opacity: 0.6; margin-bottom: 10px; }
        
        #videoElement { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .scan-frame { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70%; aspect-ratio: 1 / 1; pointer-events: none; z-index: 10; display: block; transition: all 0.3s ease; }
        .scanner-wrapper.minimized .scan-frame { display: none !important; }
        .scan-corner { position: absolute; width: 30px; height: 30px; border-color: #0071e3; border-style: solid; box-shadow: 0 0 12px rgba(0, 113, 227, 0.3); }
        .top-left { top: 0; left: 0; border-width: 4px 0 0 4px; border-radius: 8px 0 0 0; }
        .top-right { top: 0; right: 0; border-width: 4px 4px 0 0; border-radius: 0 8px 0 0; }
        .bottom-left { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-radius: 0 0 0 8px; }
        .bottom-right { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-radius: 0 0 8px 0; }
        
        .scan-laser { position: absolute; top: 0; left: 5%; width: 90%; height: 2px; background-color: #0071e3; box-shadow: 0 0 15px 2px rgba(0, 113, 227, 0.8); animation: scan 2.5s infinite linear alternate; }
        @keyframes scan { 0% { top: 8%; } 100% { top: 92%; } }

        #status { font-weight: 600; font-size: 14px; color: #86868b; text-align: center; margin: 15px 0 12px 0; transition: all 0.3s; }
        
        .matrix-container { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(32px, 1fr)); gap: 6px; margin-bottom: 12px; max-height: 150px; overflow-y: auto; transition: all 0.3s ease; }
        
        .matrix-box { 
            aspect-ratio: 1 / 1; 
            background-color: #e5e5ea; 
            border-radius: 6px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 11px; 
            font-weight: 700; 
            color: #86868b; 
            transition: transform 0.15s, background-color 0.15s, box-shadow 0.15s; 
            order: 0; 
        }
        
        .matrix-box.loaded { 
            background-color: #34c759; 
            color: white; 
            box-shadow: 0 0 8px rgba(52, 199, 89, 0.4); 
            transform: scale(1.05); 
            order: 1; 
        }

        #fpsCounter { font-size: 12px; font-weight: 600; color: #86868b; text-align: center; margin-bottom: 20px; font-family: monospace; letter-spacing: 0.5px; transition: opacity 0.3s; }

        .result-card { width: 100%; background: white; border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); box-sizing: border-box; transform: translateY(40px); opacity: 0; display: none; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .result-card.reveal { display: block; transform: translateY(0); opacity: 1; margin-top: 15px; }
        .card-header { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #86868b; margin-bottom: 12px; border-bottom: 1px solid #f2f2f7; padding-bottom: 6px; }
        
        #result-content { font-size: 16px; line-height: 1.5; color: #1d1d1f; max-height: 350px; overflow-y: auto; padding-right: 5px; }
        #result-content h1 { font-size: 22px; margin: 0 0 10px 0; color: #000; }
        #result-content h2 { font-size: 18px; margin: 15px 0 8px 0; color: #000; }
        #result-content p { margin: 0 0 12px 0; }
        #result-content ul, #result-content ol { margin: 0 0 15px 0; padding-left: 22px; }
        #result-content li { margin-bottom: 5px; }
        #result-content code { background: #f2f2f7; padding: 3px 6px; border-radius: 6px; font-family: monospace; font-size: 14px; }
        #result-content a { color: #0071e3; text-decoration: none; }
        
        #result-content table { border-collapse: collapse; width: calc(100% - 4px); margin: 15px 2px; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px #d2d2d7; font-size: 14px; }
        #result-content th { background-color: #f2f2f7; font-weight: 600; text-align: left; padding: 10px 12px; border-bottom: 1px solid #d2d2d7; }
        #result-content td { padding: 10px 12px; border-bottom: 1px solid #e5e5ea; }
        #result-content tr:last-child td { border-bottom: none; }
        
        .button-group { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        button { flex: 1 1 calc(33.33% - 6px); min-width: 85px; padding: 12px 6px; color: white; border: none; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 4px; }
        button:active { transform: scale(0.96); }
        
        .btn-copy { background-color: #0071e3; box-shadow: 0 4px 12px rgba(0, 113, 227, 0.2); }
        .btn-share { background-color: #5856d6; box-shadow: 0 4px 12px rgba(88, 86, 214, 0.2); }
        .btn-pdf { background-color: #ff9500; box-shadow: 0 4px 12px rgba(255, 149, 0, 0.2); }
        
        .btn-reset { background-color: #f5f5f7; color: #ff3b30; font-weight: 500; flex: 1 1 100%; margin-top: 4px; }
        .btn-reset:hover { background-color: #e5e5ea; }
        
        .crypto-ui { text-align: center; padding: 20px 0; }
        .crypto-ui h2 { margin-top: 0; font-size: 24px; color: #1d1d1f; }
        .crypto-ui p { color: #86868b; margin-bottom: 20px; }
        .crypto-ui input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #d2d2d7; box-sizing: border-box; font-size: 18px; text-align: center; font-family: monospace; letter-spacing: 3px; }
        .crypto-ui button { background-color: #34c759; box-shadow: 0 4px 12px rgba(52, 199, 89, 0.2); width: 100%; }
        .crypto-error { color: #ff3b30; margin-top: 15px; display: none; font-weight: 600; }
        .crypto-ui button:disabled { opacity: 0.6; cursor: wait; }
        .error-text { color: #ff3b30; font-weight: 600; }

        @media print {
            body { background: white !important; color: black !important; padding: 0 !important; margin: 0 !important; }
            .container { max-width: 100% !important; width: 100% !important; box-shadow: none !important; padding: 0 !important; margin: 0 !important; }
            h1, .scanner-wrapper, #status, .matrix-container, #fpsCounter, .card-header, .button-group { display: none !important; }
            .result-card { display: block !important; box-shadow: none !important; padding: 0 !important; margin: 0 !important; transform: none !important; opacity: 1 !important; background: white !important; }
            #result-content { max-height: none !important; overflow-y: visible !important; padding: 0 !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>QR-Receiver (WASM)</h1>
    
    <div class="scanner-wrapper" id="scannerContainer">
        <video id="videoElement" muted autoplay playsinline></video>
        
        <div id="scanFrame" class="scan-frame">
            <div class="scan-corner top-left"></div>
            <div class="scan-corner top-right"></div>
            <div class="scan-corner bottom-left"></div>
            <div class="scan-corner bottom-right"></div>
            <div class="scan-laser" id="scanLaser"></div>
        </div>
    </div>
    
    <div id="status">Warte auf Kamera-Freigabe...</div>
    
    <div class="matrix-container" id="matrixContainer"></div>
    <div id="fpsCounter">Scan-Rate: 0.0 FPS</div>
    
    <div class="result-card" id="resultCard">
        <div class="card-header" id="cardTypeHeader">Empfangene Daten</div>
        <div id="result-content"></div>
        
        <div class="button-group" id="cardButtons">
            <button class="btn-copy" id="copyBtn" onclick="copyText()">Kopieren 📋</button>
            <button class="btn-share" id="shareBtn" onclick="shareText()">Teilen 📤</button>
            <button class="btn-pdf" id="pdfBtn" onclick="exportToPDF()" style="display: none;">PDF Export 📄</button>
            <button class="btn-reset" onclick="resetScanner()">Neu scannen</button>
        </div>
    </div>
</div>

<script>
    // ===== Protokoll v2 =====
    // Header: [Frame]/[Total]|[Modus]|[Stream-ID]|[Daten]
    // Ältere Sender ohne Stream-ID werden für unverschlüsselte Streams weiterhin akzeptiert.
    const PBKDF2_ITERATIONS = 600000;
    const ALLOWED_MODES = ['TX', 'MD', 'CX', 'CM', 'EX', 'EM'];
    const MAX_FRAMES = 9999;
    const FRAME_REGEX = /^(\d{1,5})\/(\d{1,5})\|([A-Z]{2})\|(?:([0-9a-z]{4})\|)?([\s\S]*)$/;

    let receivedChunks = new Map();
    let totalChunksCount = 0;
    let currentStreamKey = null;
    let streamMode = 'TX';
    let isLegacyStream = false;
    let rawAssembledText = "";
    let encryptedPayloadBase64 = "";
    let scanTimestamps = [];

    let videoElement = null;
    let canvasElement = null;
    let canvasContext = null;
    let isScanning = false;
    let mediaStream = null;
    let scanLoopRunning = false;

    function setStatus(text) {
        document.getElementById("status").innerText = text;
    }

    async function startCamera() {
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            videoElement.srcObject = mediaStream;
            setStatus("Bereit. Richte die Kamera auf den QR-Stream.");
            isScanning = true;
            await new Promise(resolve => {
                if (videoElement.readyState >= 1) resolve();
                else videoElement.onloadedmetadata = () => resolve();
            });
            await videoElement.play().catch(() => {});
            scanLoop();
        } catch (err) {
            setStatus("Kamerafehler: " + err.message);
        }
    }

    // Kamera nach erfolgreichem Empfang wirklich ausschalten (vorher lief sie im Hintergrund weiter)
    function stopCamera() {
        if (mediaStream) {
            mediaStream.getTracks().forEach(t => t.stop());
            mediaStream = null;
        }
        videoElement.srcObject = null;
    }

    async function initScanner() {
        videoElement = document.getElementById("videoElement");
        canvasElement = document.createElement("canvas");
        canvasContext = canvasElement.getContext("2d", { willReadFrequently: true });

        if (!navigator.share) {
            document.getElementById('shareBtn').style.display = 'none';
        }
        if (typeof zbarWasm === "undefined" || typeof LZString === "undefined" || typeof DOMPurify === "undefined") {
            setStatus("❌ Bibliotheken konnten nicht geladen werden (offline oder blockiert).");
            return;
        }
        await startCamera();
    }

    async function scanLoop() {
        if (scanLoopRunning) return; // nie zwei Schleifen parallel
        scanLoopRunning = true;
        try {
            while (isScanning) {
                await new Promise(resolve => setTimeout(resolve, 30));

                if (videoElement.readyState >= 2 && videoElement.videoWidth > 0) {
                    // Canvas nur bei Grössenänderung neu dimensionieren (spart Zeit pro Frame)
                    if (canvasElement.width !== videoElement.videoWidth || canvasElement.height !== videoElement.videoHeight) {
                        canvasElement.width = videoElement.videoWidth;
                        canvasElement.height = videoElement.videoHeight;
                    }
                    canvasContext.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
                    const imageData = canvasContext.getImageData(0, 0, canvasElement.width, canvasElement.height);

                    try {
                        const symbols = await zbarWasm.scanImageData(imageData);
                        if (symbols && symbols.length > 0) {
                            // Alle erkannten Codes im Bild verarbeiten, nicht nur den ersten
                            for (const sym of symbols) {
                                if (!isScanning) break;
                                onScanSuccess(sym.decode("utf-8"));
                            }
                        }
                    } catch (error) {
                        console.error("ZBar Fehler: ", error);
                    }
                }
            }
        } finally {
            scanLoopRunning = false;
        }
    }

    function calculateLiveFPS() {
        const now = performance.now();
        scanTimestamps.push(now);
        scanTimestamps = scanTimestamps.filter(t => now - t <= 2000);

        let currentFps = 0;
        if (scanTimestamps.length > 1) {
            const timeDiffSeconds = (now - scanTimestamps[0]) / 1000;
            currentFps = (scanTimestamps.length - 1) / timeDiffSeconds;
        }
        document.getElementById("fpsCounter").innerText = `Scan-Rate: ${currentFps.toFixed(1)} FPS`;
    }

    function buildLiveMatrix(totalFrames) {
        const container = document.getElementById("matrixContainer");
        container.innerHTML = "";
        const fragment = document.createDocumentFragment();
        for (let i = 1; i <= totalFrames; i++) {
            const box = document.createElement("div");
            box.id = `matrix-box-${i}`;
            box.className = "matrix-box";
            box.innerText = i;
            fragment.appendChild(box);
        }
        container.appendChild(fragment);
    }

    function onScanSuccess(decodedText) {
        if (typeof decodedText !== "string") return;
        const protocolMatch = decodedText.match(FRAME_REGEX);
        if (!protocolMatch) return;

        const currentFrame = parseInt(protocolMatch[1], 10);
        const totalFrames = parseInt(protocolMatch[2], 10);
        const frameMode = protocolMatch[3];
        const streamId = protocolMatch[4] || null;
        const payload = protocolMatch[5];

        // Eingaben streng prüfen (vorher konnten z.B. Frame 0 oder Frame 99 von 5 den Zähler verfälschen)
        if (!ALLOWED_MODES.includes(frameMode)) return;
        if (totalFrames < 1 || totalFrames > MAX_FRAMES) return;
        if (currentFrame < 1 || currentFrame > totalFrames) return;

        calculateLiveFPS();

        // Ein neuer Stream wird an der Stream-ID erkannt (alt: nur an der Frame-Anzahl,
        // wodurch zwei Streams mit gleicher Länge vermischt werden konnten)
        const streamKey = (streamId || "legacy") + "|" + totalFrames + "|" + frameMode;
        if (streamKey !== currentStreamKey) {
            currentStreamKey = streamKey;
            totalChunksCount = totalFrames;
            receivedChunks = new Map();
            streamMode = frameMode;
            isLegacyStream = !streamId;
            scanTimestamps = [];
            buildLiveMatrix(totalFrames);
        }

        if (!receivedChunks.has(currentFrame)) {
            receivedChunks.set(currentFrame, payload);

            const box = document.getElementById(`matrix-box-${currentFrame}`);
            if (box) box.classList.add("loaded");

            const receivedCount = receivedChunks.size;
            setStatus(`Empfange: ${receivedCount} von ${totalFrames} Teilen`);

            if (receivedCount === totalFrames) {
                assembleAndCheckEncryption();
            }
        }
    }

    function revealCard() {
        const card = document.getElementById("resultCard");
        card.style.display = "block";
        setTimeout(() => { card.classList.add("reveal"); }, 50);
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    }

    function showError(header, message) {
        document.getElementById("cardTypeHeader").innerText = header;
        const content = document.getElementById("result-content");
        content.innerHTML = "";
        const p = document.createElement("p");
        p.className = "error-text";
        p.innerText = message;
        content.appendChild(p);
        document.getElementById("copyBtn").style.display = "none";
        document.getElementById("shareBtn").style.display = "none";
        document.getElementById("pdfBtn").style.display = "none";
        document.getElementById("cardButtons").style.display = "flex";
        revealCard();
        if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
    }

    function assembleAndCheckEncryption() {
        isScanning = false;
        stopCamera();
        document.getElementById("scanLaser").style.display = "none";
        document.getElementById("scannerContainer").classList.add("minimized");
        document.getElementById("status").style.display = "none";
        document.getElementById("fpsCounter").style.display = "none";
        document.getElementById("matrixContainer").style.display = "none";

        let fullAssembledString = "";
        for (let i = 1; i <= totalChunksCount; i++) {
            fullAssembledString += receivedChunks.get(i);
        }
        receivedChunks = new Map();

        if (streamMode === 'EX' || streamMode === 'EM') {
            if (isLegacyStream) {
                showError("⚠️ ALTES FORMAT",
                    "Dieser Stream wurde mit einer alten Version des QR-Streamers (CryptoJS-Verschlüsselung) erzeugt. " +
                    "Aus Sicherheitsgründen wird dieses Format nicht mehr unterstützt. Bitte aktualisiere QR-Streamer.html und sende erneut.");
                return;
            }
            encryptedPayloadBase64 = fullAssembledString;
            document.getElementById("cardTypeHeader").innerText = "🔒 VERSCHLÜSSELTER EMPFANG";
            document.getElementById("cardButtons").style.display = "none";

            document.getElementById("result-content").innerHTML = `
                <div class="crypto-ui">
                    <h2>Geschützte Daten</h2>
                    <p>Dieser Stream ist verschlüsselt (AES-256-GCM). Bitte gib den PIN bzw. die Passphrase ein.</p>
                    <input type="password" id="receiverPin" placeholder="PIN eingeben" autocomplete="off" autocapitalize="off" spellcheck="false">
                    <button id="decryptBtn">Entschlüsseln 🔓</button>
                    <p class="crypto-error" id="decryptError">Falscher PIN oder beschädigte Daten.</p>
                </div>
            `;
            document.getElementById("decryptBtn").addEventListener("click", attemptDecryption);
            document.getElementById("receiverPin").addEventListener("keydown", (e) => { if (e.key === "Enter") attemptDecryption(); });
            revealCard();
        } else {
            processDecryptedData(fullAssembledString);
        }
    }

    function base64ToBytes(b64) {
        const bin = atob(b64.replace(/\s+/g, ""));
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
    }

    // AES-256-GCM + PBKDF2-SHA256 über die Web Crypto API.
    // GCM prüft die Integrität: ein falscher PIN oder manipulierte Daten führen garantiert zu einem Fehler
    // (vorher konnte CryptoJS bei falschem PIN zufälligen "Datensalat" liefern).
    async function decryptPayload(b64, passphrase) {
        if (!window.crypto || !crypto.subtle) {
            throw new Error("Web Crypto API nicht verfügbar (Seite muss über https:// oder lokal geöffnet werden).");
        }
        const data = base64ToBytes(b64);
        if (data.length < 16 + 12 + 16) throw new Error("Daten zu kurz");
        const salt = data.slice(0, 16);
        const iv = data.slice(16, 28);
        const cipher = data.slice(28);
        const enc = new TextEncoder();
        const baseKey = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
        const key = await crypto.subtle.deriveKey(
            { name: "PBKDF2", salt, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" },
            baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
        );
        const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipher);
        return new TextDecoder("utf-8", { fatal: true }).decode(plain);
    }

    let decryptInProgress = false;
    async function attemptDecryption() {
        if (decryptInProgress) return;
        const pinField = document.getElementById("receiverPin");
        const btn = document.getElementById("decryptBtn");
        const errorEl = document.getElementById("decryptError");
        const pin = pinField.value;
        if (!pin) return;

        decryptInProgress = true;
        btn.disabled = true;
        btn.innerText = "Entschlüssele…";
        errorEl.style.display = "none";
        try {
            const decryptedString = await decryptPayload(encryptedPayloadBase64, pin);
            encryptedPayloadBase64 = "";
            document.getElementById("cardButtons").style.display = "flex";
            processDecryptedData(decryptedString);
        } catch (e) {
            pinField.value = "";
            errorEl.style.display = "block";
            btn.disabled = false;
            btn.innerText = "Entschlüsseln 🔓";
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
        } finally {
            decryptInProgress = false;
        }
    }

    // Der intelligente und fehlertolerante CSV-Detektor
    function formatIfCsv(text) {
        const lines = text.trim().split('\n');

        if (lines.length < 3) return text;

        const separator = lines[0].includes(';') ? ';' : (lines[0].includes(',') ? ',' : null);
        if (!separator) return text;

        const expectedColumns = lines[0].split(separator).length;
        if (expectedColumns < 2) return text;

        let validCsvLines = [];
        let extraTextLines = [];
        let isStillCsv = true;

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();

            if (line === "") {
                if (!isStillCsv) extraTextLines.push(line);
                continue;
            }

            if (isStillCsv) {
                if (line.split(separator).length === expectedColumns) {
                    validCsvLines.push(line);
                } else {
                    isStillCsv = false;
                    extraTextLines.push(line);
                }
            } else {
                extraTextLines.push(line);
            }
        }

        if (validCsvLines.length < 2) return text;

        let markdownTable = "";
        validCsvLines.forEach((line, index) => {
            // "|" in Zellen escapen, sonst zerfällt die Markdown-Tabelle
            const columns = line.split(separator).map(cell => cell.trim().replace(/\|/g, "\\|"));
            markdownTable += "| " + columns.join(" | ") + " |\n";

            if (index === 0) {
                markdownTable += "|" + columns.map(() => "---").join("|") + "|\n";
            }
        });

        if (extraTextLines.length > 0) {
            markdownTable += "\n\n" + extraTextLines.join("\n");
        }

        return markdownTable;
    }

    // Markdown -> HTML -> DOMPurify. Ohne diesen Schritt konnte ein präparierter QR-Code
    // beliebiges JavaScript im Reader ausführen (z.B. <img src=x onerror=...>).
    function renderSafeMarkdown(markdown) {
        const html = marked.parse(markdown, { breaks: true, mangle: false, headerIds: false });
        return DOMPurify.sanitize(html, {
            USE_PROFILES: { html: true },
            FORBID_TAGS: ['style', 'form', 'input', 'button', 'textarea', 'select'],
            FORBID_ATTR: ['style']
        });
    }

    function processDecryptedData(payloadString) {
        let finalDecodedText = payloadString;

        // Dekompression falls nötig
        if (['CX', 'CM', 'EX', 'EM'].includes(streamMode)) {
            let decompressed = null;
            try {
                decompressed = LZString.decompressFromEncodedURIComponent(payloadString);
            } catch (e) {
                decompressed = null;
            }
            // LZString wirft bei kaputten Daten meist KEINEN Fehler, sondern liefert null oder "" zurück
            if (decompressed === null || (decompressed === "" && payloadString.length > 0)) {
                showError("❌ FEHLER", "Die Daten konnten nicht dekomprimiert werden (beschädigt oder unvollständig). Bitte neu scannen.");
                return;
            }
            finalDecodedText = decompressed;
        }

        rawAssembledText = finalDecodedText; // Unangetastet für den Kopieren-Button

        const contentArea = document.getElementById("result-content");
        const headerArea = document.getElementById("cardTypeHeader");
        const pdfBtn = document.getElementById("pdfBtn");

        // Nur formatieren, wenn der SENDER auch Markdown (MD, CM, EM) gewählt hat
        const isMarkdownMode = ['MD', 'CM', 'EM'].includes(streamMode);

        if (isMarkdownMode) {
            let textForDisplay = formatIfCsv(finalDecodedText);
            let isCsv = (textForDisplay !== finalDecodedText);

            contentArea.innerHTML = renderSafeMarkdown(textForDisplay);
            // Links sicher in neuem Tab öffnen
            contentArea.querySelectorAll("a[href]").forEach(a => {
                a.setAttribute("target", "_blank");
                a.setAttribute("rel", "noopener noreferrer");
            });

            headerArea.innerText = isCsv ? "📊 Empfang: CSV Tabelle" : "📝 Empfang: Markdown Dokument";

            pdfBtn.style.display = "flex";
            contentArea.style.whiteSpace = "normal";

            if (typeof renderMathInElement === "function") {
                renderMathInElement(contentArea, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false,
                    trust: false
                });
            }

        } else {
            // Text-Modus (TX, CX, EX): Strikt roher Text, keine Formatierung, kein PDF
            contentArea.textContent = finalDecodedText;
            headerArea.innerText = "📄 Empfang: Reiner Text (Plaintext)";

            pdfBtn.style.display = "none";
            contentArea.style.whiteSpace = "pre-wrap";
        }

        document.getElementById("copyBtn").style.display = "flex";
        if (navigator.share) document.getElementById("shareBtn").style.display = "flex";

        // Bei verschlüsselten Streams ist die Karte schon sichtbar
        if (!['EX', 'EM'].includes(streamMode)) {
            revealCard();
        }
    }

    function exportToPDF() {
        window.print();
    }

    function resetScanner() {
        const card = document.getElementById("resultCard");
        card.classList.remove("reveal");

        setTimeout(() => {
            card.style.display = "none";
            document.getElementById("result-content").innerHTML = "";
            document.getElementById("scannerContainer").classList.remove("minimized");
            document.getElementById("matrixContainer").style.display = "grid";
            document.getElementById("matrixContainer").innerHTML = "";
            document.getElementById("fpsCounter").style.display = "block";
            document.getElementById("fpsCounter").innerText = "Scan-Rate: 0.0 FPS";
            document.getElementById("status").style.display = "block";
            document.getElementById("scanLaser").style.display = "block";
            document.getElementById("cardButtons").style.display = "flex";
            document.getElementById("pdfBtn").style.display = "none";

            receivedChunks = new Map();
            totalChunksCount = 0;
            currentStreamKey = null;
            rawAssembledText = "";
            encryptedPayloadBase64 = "";
            scanTimestamps = [];

            setStatus("Starte Kamera...");

            const copyBtn = document.getElementById("copyBtn");
            copyBtn.innerText = "Kopieren 📋";
            copyBtn.style.backgroundColor = "#0071e3";

            startCamera();
        }, 400);
    }

    function copyText() {
        if (!rawAssembledText) return;
        navigator.clipboard.writeText(rawAssembledText).then(() => {
            const copyBtn = document.getElementById("copyBtn");
            copyBtn.innerText = "Gesichert! ✓";
            copyBtn.style.backgroundColor = "#34c759";
            if (navigator.vibrate) navigator.vibrate(50);
            setTimeout(() => {
                copyBtn.innerText = "Kopieren 📋";
                copyBtn.style.backgroundColor = "#0071e3";
            }, 2000);
        }).catch(() => {
            alert("Kopieren nicht möglich – bitte Text manuell markieren.");
        });
    }

    function shareText() {
        if (!rawAssembledText || !navigator.share) return;
        navigator.share({ title: 'Sicherer Datenempfang (QR)', text: rawAssembledText }).catch(() => {});
    }

    // Kamera freigeben, wenn die Seite verlassen wird
    window.addEventListener('pagehide', stopCamera);
    window.addEventListener('DOMContentLoaded', initScanner);
</script>
