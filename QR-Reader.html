<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-Code Datenüberträger (Empfänger)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            padding: 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        .container {
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        h1 { font-size: 22px; font-weight: 700; margin-top: 10px; margin-bottom: 20px; text-align: center; color: #1d1d1f; }
        
        /* --- SCANNER WRAPPER & TRANSITION --- */
        .scanner-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Wenn fertig, schrumpft der Scanner elegant zusammen */
        .scanner-wrapper.minimized {
            height: 120px !important;
            opacity: 0.6;
            margin-bottom: 10px;
        }
        #reader {
            width: 100%;
            border: none;
        }
        
        /* Neon-Fokus-Rahmen */
        .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            aspect-ratio: 1 / 1;
            pointer-events: none;
            z-index: 10;
            display: none;
            transition: all 0.3s ease;
        }
        .scanner-wrapper.minimized .scan-frame {
            display: none !important; /* Blendet Rahmen aus, wenn minimiert */
        }
        .scan-corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: #0071e3; /* Edles Apple-Blau statt Grün */
            border-style: solid;
            box-shadow: 0 0 12px rgba(0, 113, 227, 0.3);
        }
        .top-left { top: 0; left: 0; border-width: 4px 0 0 4px; border-radius: 8px 0 0 0; }
        .top-right { top: 0; right: 0; border-width: 4px 4px 0 0; border-radius: 0 8px 0 0; }
        .bottom-left { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-radius: 0 0 0 8px; }
        .bottom-right { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-radius: 0 0 8px 0; }
        
        /* Pulsierender Laser */
        .scan-laser {
            position: absolute;
            top: 0;
            left: 5%;
            width: 90%;
            height: 2px;
            background-color: #0071e3;
            box-shadow: 0 0 15px 2px rgba(0, 113, 227, 0.8);
            animation: scan 2.5s infinite linear alternate;
        }
        @keyframes scan {
            0% { top: 8%; }
            100% { top: 92%; }
        }

        /* Status & Progress */
        #status { font-weight: 600; font-size: 14px; color: #86868b; text-align: center; margin: 15px 0 5px 0; transition: all 0.3s; }
        .progress-bar { width: 100%; background-color: #e5e5ea; border-radius: 10px; height: 8px; overflow: hidden; margin-bottom: 20px; }
        .progress-fill { height: 100%; width: 0%; background-color: #0071e3; transition: width 0.15s ease; }
        
        /* --- NEUE LIVE-ERGEBNIS-KARTE --- */
        .result-card {
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            box-sizing: border-box;
            transform: translateY(40px);
            opacity: 0;
            display: none;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        /* Klasse wird per JS hinzugefügt, wenn Text da ist */
        .result-card.reveal {
            display: block;
            transform: translateY(0);
            opacity: 1;
            margin-top: 15px;
        }
        
        .card-header {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #86868b;
            margin-bottom: 12px;
            border-bottom: 1px solid #f2f2f7;
            padding-bottom: 6px;
        }
        
        /* Das gerenderte Inhaltsfeld */
        #result-content {
            font-size: 16px;
            line-height: 1.5;
            color: #1d1d1f;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        /* Schickes Markdown-Styling im Inneren der Karte */
        #result-content h1 { font-size: 22px; margin: 0 0 10px 0; color: #000; }
        #result-content h2 { font-size: 18px; margin: 15px 0 8px 0; color: #000; }
        #result-content p { margin: 0 0 12px 0; }
        #result-content ul, #result-content ol { margin: 0 0 15px 0; padding-left: 22px; }
        #result-content li { margin-bottom: 5px; }
        #result-content code { background: #f2f2f7; padding: 3px 6px; border-radius: 6px; font-family: monospace; font-size: 14px; }
        #result-content a { color: #0071e3; text-decoration: none; }
        #result-content a:hover { text-decoration: underline; }
        
        /* Button Bedienleiste am Fussende der Karte */
        .button-group { display: flex; gap: 12px; margin-top: 20px; }
        button { flex: 2; padding: 14px; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        button:active { transform: scale(0.98); }
        .btn-copy { background-color: #0071e3; box-shadow: 0 4px 12px rgba(0, 113, 227, 0.2); }
        .btn-reset { background-color: #f5f5f7; color: #ff3b30; flex: 1; font-weight: 500; }
        .btn-reset:hover { background-color: #e5e5ea; }
    </style>
</head>
<body>

<div class="container">
    <h1>QR-Receiver</h1>
    
    <div class="scanner-wrapper" id="scannerContainer">
        <div id="reader"></div>
        <div id="scanFrame" class="scan-frame">
            <div class="scan-corner top-left"></div>
            <div class="scan-corner top-right"></div>
            <div class="scan-corner bottom-left"></div>
            <div class="scan-corner bottom-right"></div>
            <div class="scan-laser" id="scanLaser"></div>
        </div>
    </div>
