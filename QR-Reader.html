<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-Code Datenüberträger (Empfänger)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.8/katex.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.8/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.8/contrib/auto-render.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            padding: 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        .container {
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        h1 { font-size: 22px; font-weight: 700; margin-top: 10px; margin-bottom: 20px; text-align: center; color: #1d1d1f; }
        
        /* --- SCANNER WRAPPER & TRANSITION --- */
        .scanner-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .scanner-wrapper.minimized {
            height: 120px !important;
            opacity: 0.6;
            margin-bottom: 10px;
        }
        #reader {
            width: 100%;
            border: none;
        }
        
        /* Neon-Fokus-Rahmen */
        .scan-frame {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 70%; aspect-ratio: 1 / 1;
            pointer-events: none; z-index: 10; display: none; transition: all 0.3s ease;
        }
        .scanner-wrapper.minimized .scan-frame { display: none !important; }
        .scan-corner { position: absolute; width: 30px; height: 30px; border-color: #0071e3; border-style: solid; box-shadow: 0 0 12px rgba(0, 113, 227, 0.3); }
        .top-left { top: 0; left: 0; border-width: 4px 0 0 4px; border-radius: 8px 0 0 0; }
        .top-right { top: 0; right: 0; border-width: 4px 4px 0 0; border-radius: 0 8px 0 0; }
        .bottom-left { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-radius: 0 0 0 8px; }
        .bottom-right { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-radius: 0 0 8px 0; }
        
        /* Pulsierender Laser */
        .scan-laser {
            position: absolute; top: 0; left: 5%; width: 90%; height: 2px;
            background-color: #0071e3; box-shadow: 0 0 15px 2px rgba(0, 113, 227, 0.8);
            animation: scan 2.5s infinite linear alternate;
        }
        @keyframes scan { 0% { top: 8%; } 100% { top: 92%; } }

        /* Status & Progress */
        #status { font-weight: 600; font-size: 14px; color: #86868b; text-align: center; margin: 15px 0 5px 0; transition: all 0.3s; }
        .progress-bar { width: 100%; background-color: #e5e5ea; border-radius: 10px; height: 8px; overflow: hidden; margin-bottom: 20px; }
        .progress-fill { height: 100%; width: 0%; background-color: #0071e3; transition: width 0.15s ease; }
        
        /* Live-Ergebnis-Karte */
        .result-card {
            width: 100%; background: white; border-radius: 20px; padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06); box-sizing: border-box;
            transform: translateY(40px); opacity: 0; display: none; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .result-card.reveal { display: block; transform: translateY(0); opacity: 1; margin-top: 15px; }
        .card-header { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #86868b; margin-bottom: 12px; border-bottom: 1px solid #f2f2f7; padding-bottom: 6px; }
        
        /* Das gerenderte Inhaltsfeld */
        #result-content { font-size: 16px; line-height: 1.5; color: #1d1d1f; max-height: 280px; overflow-y: auto; padding-right: 5px; }
        
        /* Markdown-Styling im Inneren der Karte */
        #result-content h1 { font-size: 22px; margin: 0 0 10px 0; color: #000; }
        #result-content h2 { font-size: 18px; margin: 15px 0 8px 0; color: #000; }
        #result-content p { margin: 0 0 12px 0; }
        #result-content ul, #result-content ol { margin: 0 0 15px 0; padding-left: 22px; }
        #result-content li { margin-bottom: 5px; }
        #result-content code { background: #f2f2f7; padding: 3px 6px; border-radius: 6px; font-family: monospace; font-size: 14px; }
        #result-content a { color: #0071e3; text-decoration: none; }
        
/* --- NEU: Styling für Markdown-Tabellen (Obsidian-Style) --- */
        #result-content table { 
            border-collapse: collapse; 
            width: calc(100% - 4px); /* Minimal schmaler machen */
            margin: 15px 2px;        /* 2px Abstand für den Schatten links/rechts */
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 0 0 1px #d2d2d7; 
            font-size: 14px;
        }
        #result-content th { 
            background-color: #f2f2f7; 
            font-weight: 600; 
            text-align: left; 
            padding: 10px 12px; 
            border-bottom: 1px solid #d2d2d7; 
        }
        #result-content td { 
            padding: 10px 12px; 
            border-bottom: 1px solid #e5e5ea; 
        }
        #result-content tr:last-child td { 
            border-bottom: none; 
        }
        #result-content { 
            overflow-x: auto; 
        }
        
        /* Button Bedienleiste am Fussende */
        .button-group { display: flex; gap: 12px; margin-top: 20px; }
        button { flex: 2; padding: 14px; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        button:active { transform: scale(0.98); }
        .btn-copy { background-color: #0071e3; box-shadow: 0 4px 12px rgba(0, 113, 227, 0.2); }
        .btn-reset { background-color: #f5f5f7; color: #ff3b30; flex: 1; font-weight: 500; }
        .btn-reset:hover { background-color: #e5e5ea; }
    </style>
</head>
<body>

<div class="container">
    <h1>QR-Receiver</h1>
    
    <div class="scanner-wrapper" id="scannerContainer">
        <div id="reader"></div>
        <div id="scanFrame" class="scan-frame">
            <div class="scan-corner top-left"></div>
            <div class="scan-corner top-right"></div>
            <div class="scan-corner bottom-left"></div>
            <div class="scan-corner bottom-right"></div>
            <div class="scan-laser" id="scanLaser"></div>
        </div>
    </div>
    
    <div id="status">Warte auf Kamera-Freigabe...</div>
    
    <div class="progress-bar" id="progressContainer">
        <div id="progress" class="progress-fill"></div>
    </div>
    
    <div class="result-card" id="resultCard">
        <div class="card-header" id="cardTypeHeader">Empfangene Daten</div>
        <div id="result-content"></div>
        
        <div class="button-group">
            <button class="btn-copy" id="copyBtn" onclick="copyText()">Text kopieren 📋</button>
            <button class="btn-reset" onclick="resetScanner()">Neu scannen</button>
        </div>
    </div>
</div>

<script>
    let receivedChunks = {};
    let totalChunksCount = 0;
    let html5QrcodeScanner = null;
    let streamMode = 'TX'; 
    let rawAssembledText = ""; 

    function startScanner() {
        html5QrcodeScanner = new Html5Qrcode("reader");
        const config = { 
            fps: 30, 
            qrbox: function(viewfinderWidth, viewfinderHeight) {
                return { width: viewfinderWidth * 0.70, height: viewfinderWidth * 0.70 };
            }
        };

        html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess)
        .then(() => {
            document.getElementById("status").innerText = "Bereit. Richte die Kamera auf den QR-Stream.";
            document.getElementById("scanFrame").style.display = "block";
        }).catch(err => {
            document.getElementById("status").innerText = "Kamerafehler: " + err;
        });
    }

    function onScanSuccess(decodedText) {
        const protocolMatch = decodedText.match(/^(\d+)\/(\d+)\|([A-Z]{2})\|([\s\S]*)$/);
        
        if (!protocolMatch) return; 

        const currentFrame = parseInt(protocolMatch[1]);
        const totalFrames = parseInt(protocolMatch[2]);
        const frameMode = protocolMatch[3];
        const payload = protocolMatch[4];

        if (totalChunksCount !== totalFrames) {
            totalChunksCount = totalFrames;
            receivedChunks = {};
            streamMode = frameMode; 
        }

        if (!receivedChunks[currentFrame]) {
            receivedChunks[currentFrame] = payload;
            
            const receivedCount = Object.keys(receivedChunks).length;
            const progressPercent = (receivedCount / totalFrames) * 100;
            document.getElementById("progress").style.width = progressPercent + "%";
            
            document.getElementById("status").innerText = `Empfange: ${receivedCount} von ${totalFrames} Teilen`;

            if (receivedCount === totalFrames) {
                assembleText();
            }
        }
    }

    function assembleText() {
        document.getElementById("scanLaser").style.display = "none";
        document.getElementById("scannerContainer").classList.add("minimized");
        document.getElementById("progressContainer").style.display = "none";
        document.getElementById("status").style.display = "none";

        let fullAssembledString = "";
        for (let i = 1; i <= totalChunksCount; i++) {
            fullAssembledString += receivedChunks[i];
        }
        
        let finalDecodedText = fullAssembledString;

        if (streamMode === 'CX' || streamMode === 'CM') {
            try {
                finalDecodedText = LZString.decompressFromEncodedURIComponent(fullAssembledString);
            } catch (e) {
                document.getElementById("status").style.display = "block";
                document.getElementById("status").innerText = "❌ Dekompressionsfehler!";
                return;
            }
        }
        
        rawAssembledText = finalDecodedText; 
        const contentArea = document.getElementById("result-content");
        const headerArea = document.getElementById("cardTypeHeader");
        
        if (streamMode === 'MD' || streamMode === 'CM') {
            contentArea.innerHTML = marked.parse(finalDecodedText);
            headerArea.innerText = "📝 Empfang: Markdown Dokument";
        } else {
            contentArea.innerText = finalDecodedText;
            headerArea.innerText = "📄 Empfang: Reiner Text (Plaintext)";
        }

        // Auto-Render für LaTeX (KaTeX) ausführen
        renderMathInElement(contentArea, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
            ],
            throwOnError: false
        });
        
        const card = document.getElementById("resultCard");
        card.style.display = "block";
        setTimeout(() => {
            card.classList.add("reveal");
        }, 50);
        
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    }

    function resetScanner() {
        const card = document.getElementById("resultCard");
        card.classList.remove("reveal");
        
        setTimeout(() => {
            card.style.display = "none";
            
            document.getElementById("scannerContainer").classList.remove("minimized");
            document.getElementById("progressContainer").style.display = "block";
            document.getElementById("status").style.display = "block";
            document.getElementById("scanLaser").style.display = "block";
            
            receivedChunks = {};
            totalChunksCount = 0;
            rawAssembledText = "";
            document.getElementById("progress").style.width = "0%";
            document.getElementById("result-content").innerHTML = "";
            document.getElementById("status").innerText = "Bereit. Richte die Kamera auf den QR-Stream.";
            
            const copyBtn = document.getElementById("copyBtn");
            copyBtn.innerText = "Text kopieren 📋";
            copyBtn.style.backgroundColor = "#0071e3";
        }, 400);
    }

    function copyText() {
        if (!rawAssembledText) return;

        navigator.clipboard.writeText(rawAssembledText).then(() => {
            const copyBtn = document.getElementById("copyBtn");
            copyBtn.innerText = "In Zwischenablage gesichert! ✓";
            copyBtn.style.backgroundColor = "#34c759";
            if (navigator.vibrate) navigator.vibrate(50);

            setTimeout(() => {
                copyBtn.innerText = "Text kopieren 📋";
                copyBtn.style.backgroundColor = "#0071e3";
            }, 2000);
        });
    }

    window.addEventListener('DOMContentLoaded', startScanner);
</script>

</body>
</html>
